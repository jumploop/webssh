name: Create Release

on:
  push:
    tags:
      - 'v*.*.*'  # 触发条件：推送以 "v" 开头的标签 (例如 v1.2.3)

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # 允许创建/更新 release

    steps:
      # actions/create-release@v1 已被 GitHub 废弃，改用官方 gh CLI。
      # --generate-notes 仅 gh release create 支持，因此统一先用
      # Release Notes API 生成变更日志，再用于 create/edit（幂等，支持工作流重跑）。
      - name: Create or Update Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          gh api -X POST "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
            -f tag_name="$TAG" --jq '.body' > "$RUNNER_TEMP/release-notes.md"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # release 已存在（例如工作流重跑），仅更新其内容
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" \
              --title "Release $TAG" \
              --notes-file "$RUNNER_TEMP/release-notes.md"
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
              --title "Release $TAG" \
              --notes-file "$RUNNER_TEMP/release-notes.md"
          fi
